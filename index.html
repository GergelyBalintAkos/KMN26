<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMN26</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f9f9f7;color:#222}
h1{font-size:20px;margin-bottom:5px}
p{font-size:13px;color:#888;margin-bottom:15px}
.bar{background:#eee;padding:10px 15px;border-radius:8px;margin-bottom:15px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:green;display:inline-block}
button{padding:6px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.tab.on{background:#222;color:#fff;border-color:#222}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
input{min-width:200px}
.stats{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px 15px;min-width:120px}
.stat .n{font-size:20px;font-weight:bold}
.stat .l{font-size:11px;color:#888}
.wrap{overflow-x:auto;background:#fff;border:1px solid #eee;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;background:#f5f5f3;text-align:left;font-size:12px;color:#666;white-space:nowrap;cursor:pointer}
td{padding:9px 12px;border-top:1px solid #f0f0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#fafafa;cursor:pointer}
tr.ures td{color:#bbb;font-style:italic}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.bf{background:#deeeff;color:#0a4080}
.bb{background:#eeeaff;color:#3a2090}
.bfk{background:#d8f5e8;color:#0a5030}
.br{background:#fff0d8;color:#704000}
.bok{background:#d8f5d8;color:#0a5010}
.bvr{background:#fff3d8;color:#705010}
.btd{background:#ffd8d8;color:#700010}
.ok{color:#3a8a3a;font-size:16px}
.vr{color:#cc8800;font-size:16px}
.ur{color:#bbb;font-size:16px}
.status-table th{white-space:nowrap;font-size:11px;padding:8px 6px}
.status-table td{padding:8px 6px;text-align:center;font-size:15px}
.status-table td:first-child{text-align:left;font-size:13px;white-space:nowrap;padding-left:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.status-table td:nth-child(2){text-align:left;font-size:12px;white-space:nowrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;justify-content:center;align-items:flex-start;padding-top:40px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:10px;width:90%;max-width:620px;max-height:85vh;overflow-y:auto;padding:20px}
.mbox h3{font-size:16px;margin-bottom:5px}
.mclose{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#888}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{grid-column:1/-1}
.ml{font-size:11px;color:#888;margin-bottom:3px}
.mv{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.todo{background:#fff8e8;border-radius:6px;padding:10px;color:#704000;font-size:13px;margin-bottom:15px;white-space:pre-wrap}
.empty{text-align:center;padding:40px;color:#aaa}
.legend{display:flex;gap:15px;font-size:12px;color:#666;margin-bottom:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.uzenet-box{background:#f0f7ff;border:1px solid #b8d4f0;border-radius:8px;padding:15px;margin-top:15px}
.uzenet-box h4{font-size:13px;color:#0a4080;margin-bottom:10px;font-weight:600}
.uzenet-text{background:#fff;border:1px solid #dde;border-radius:6px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;color:#333;min-height:80px}
.copy-btn{margin-top:10px;padding:8px 16px;background:#0a4080;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;width:100%}
.copy-btn:hover{background:#0d5099}
.copy-btn.copied{background:#3a8a3a}
.msub{font-size:12px;color:#888;margin-bottom:15px}
.divider{border:none;border-top:1px solid #eee;margin:15px 0}
</style>
</head>
<body>
<h1>KMN26 — Koncertadatbázis</h1>
<p>Élő nézet a Google Sheets-ből</p>
<div class="bar">
  <span class="dot"></span>
  <span id="info">Betöltés...</span>
  <button onclick="load()">↻ Frissítés</button>
</div>
<div class="tabs">
  <button class="tab on" onclick="setTab('all',this)">📋 Összes</button>
  <button class="tab" onclick="setTab('todo',this)">✅ Teendők</button>
  <button class="tab" onclick="setTab('status',this)">📊 Státusz</button>
  <button class="tab" onclick="setTab('money',this)">💰 Pénzügy</button>
  <button class="tab" onclick="setTab('cater',this)">🍽️ Catering</button>
</div>
<div class="filters">
  <input type="text" id="q" placeholder="Keresés..." oninput="render()">
  <select id="fhely" onchange="render()"><option value="">Minden helyszín</option></select>
  <select id="fdat" onchange="render()"><option value="">Minden dátum</option></select>
</div>
<div class="stats" id="stats"></div>
<div id="legend" class="legend" style="display:none">
  <span><span class="ok">✅</span> Megvan</span>
  <span><span class="vr">⏳</span> Várom / TBA</span>
  <span><span class="ur">—</span> Nincs info</span>
</div>
<div class="wrap"><table id="maintable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div style="font-size:12px;color:#888;padding:8px 0" id="count"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <button class="mclose" onclick="closeModal()">×</button>
    <h3 id="mtitle"></h3>
    <div class="msub" id="msub"></div>
    <div id="mbody"></div>
  </div>
</div>
<script>
var ROWS=[], TAB='all', SK=null, SD=1;
var SID='1TU1LasWxZE2wuFUsAXq9hEzyAIym3BDIUnVTmwG18OQ';

var STATUS_COLS=[
  {k:'fotok',l:'Fotók'},
  {k:'leiras',l:'Leírás'},
  {k:'rider',l:'Rider'},
  {k:'jarmuvek',l:'Járművek'},
  {k:'stab',l:'Stáb'},
  {k:'fellepo_szam',l:'Fellépők'},
  {k:'erkezes_dat',l:'Érk. dátum'},
  {k:'erkezes_ido',l:'Érk. idő'},
  {k:'visszaut_dat',l:'Visszaut.'},
  {k:'visszaut_ido',l:'Visszaut. idő'},
  {k:'checkin',l:'Check In'},
  {k:'checkout',l:'Check Out'},
  {k:'szobak',l:'Szobák'},
  {k:'szallaslista',l:'Szálláslista'},
  {k:'veget',l:'Veget/Allerg'},
  {k:'playlist',l:'Playlist'},
];

function parseCSV(text) {
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<text.length;i++) {
    var c=text[i];
    if(c==='"') { if(q&&text[i+1]==='"'){cur+='"';i++;}else q=!q; }
    else if(c===','&&!q) { row.push(cur); cur=''; }
    else if((c==='\n'||c==='\r')&&!q) { if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}

function na(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[őű]/g,function(c){return c==='ő'?'o':'u';}).replace(/\n/g,' ').trim().replace(/\s+/g,' ');
}

function mapRows(grid) {
  if(grid.length<2) return [];
  var h=grid[0], ix={};
  ix.muv=0; ix.hely=1; ix.dat=2; ix.nap=3; ix.t1=4;
  for(var i=5;i<h.length;i++) {
    var l=na(h[i]);
    if(l.indexOf('jelenlegi')>=0||l.indexOf('feladatok')>=0) ix.helyzet=i;
    else if(l==='elerhetoseg') ix.felelos=i;
    else if(l.indexOf('funkcio')>=0) ix.funkcio=i;
    else if(l.indexOf('telefon')>=0) ix.tel=i;
    else if(l.indexOf('mail')>=0) ix.email=i;
    else if(l==='osszeg') ix.osszeg=i;
    else if(l==='huf') ix.huf=i;
    else if(l==='ron') ix.ron=i;
    else if(l.indexOf('szolgaltato')>=0) ix.szolg=i;
    else if(l.indexOf('bistro')>=0) ix.bistro=i;
    else if(l.indexOf('culina')>=0&&l.indexOf('ebed')>=0) ix.ceb=i;
    else if(l.indexOf('culina')>=0&&l.indexOf('20')>=0) ix.cv21=i;
    else if(l.indexOf('culina')>=0&&l.indexOf('22')>=0) ix.cv22=i;
    else if(l.indexOf('culina')>=0&&l.indexOf('farkas')>=0) ix.cfu=i;
    else if(l.indexOf('foto')>=0&&l.indexOf('tovabb')<0) ix.fotok=i;
    else if(l.indexOf('leiras')>=0&&l.indexOf('tovabb')<0) ix.leiras=i;
    else if(l.indexOf('rider')>=0) ix.rider=i;
    else if(l.indexOf('jarmuvek')>=0||l.indexOf('jarmu')>=0) ix.jarmuvek=i;
    else if(l.indexOf('teljes stab')>=0||(l.indexOf('stab')>=0&&l.indexOf('fellepo')<0&&l.indexOf('szama')>=0)) ix.stab=i;
    else if(l.indexOf('fellepo')>=0&&l.indexOf('szama')>=0) ix.fellepo_szam=i;
    else if(l.indexOf('erkezes')>=0&&l.indexOf('datuma')>=0) ix.erkezes_dat=i;
    else if(l.indexOf('erkezes')>=0&&l.indexOf('idopontja')>=0) ix.erkezes_ido=i;
    else if(l.indexOf('visszautazas')>=0&&l.indexOf('datuma')>=0) ix.visszaut_dat=i;
    else if(l.indexOf('visszautazas')>=0&&l.indexOf('idopontja')>=0) ix.visszaut_ido=i;
    else if(l.indexOf('check in')>=0&&l.indexOf('datuma')>=0) ix.checkin=i;
    else if(l.indexOf('check out')>=0&&l.indexOf('datuma')>=0) ix.checkout=i;
    else if(l.indexOf('szobak szama')>=0||(l.indexOf('szobak')>=0&&l.indexOf('szama')>=0)) ix.szobak=i;
    else if(l.indexOf('szallaslista')>=0) ix.szallaslista=i;
    else if(l.indexOf('vegetarianus')>=0||l.indexOf('allergi')>=0) ix.veget=i;
    else if(l.indexOf('playlist')>=0) ix.playlist=i;
  }
  var res=[];
  for(var r=1;r<grid.length;r++) {
    var row=grid[r];
    var muv=row[0]||'', hely=row[1]||'', dat=row[2]||'';
    if(!muv&&!hely&&!dat) continue;
    var pm=function(v){var m=String(v||'').replace(/[.\s]/g,'').match(/\d+/);return m?parseInt(m[0]):null;};
    res.push({
      muv:muv||'(üres szlot)', hely:hely, dat:dat,
      nap:row[ix.nap]||'', t1:row[ix.t1]||'',
      helyzet:row[ix.helyzet]||'', felelos:row[ix.felelos]||'',
      funkcio:row[ix.funkcio]||'', tel:row[ix.tel]||'',
      email:row[ix.email]||'', osszeg:row[ix.osszeg]||'',
      huf:pm(row[ix.huf]), ron:pm(row[ix.ron]),
      szolg:row[ix.szolg]||'', bistro:row[ix.bistro]||'',
      ceb:row[ix.ceb]||'', cv21:row[ix.cv21]||'',
      cv22:row[ix.cv22]||'', cfu:row[ix.cfu]||'',
      fotok:row[ix.fotok]||'', leiras:row[ix.leiras]||'',
      rider:row[ix.rider]||'', jarmuvek:row[ix.jarmuvek]||'',
      stab:row[ix.stab]||'', fellepo_szam:row[ix.fellepo_szam]||'',
      erkezes_dat:row[ix.erkezes_dat]||'', erkezes_ido:row[ix.erkezes_ido]||'',
      visszaut_dat:row[ix.visszaut_dat]||'', visszaut_ido:row[ix.visszaut_ido]||'',
      checkin:row[ix.checkin]||'', checkout:row[ix.checkout]||'',
      szobak:row[ix.szobak]||'', szallaslista:row[ix.szallaslista]||'',
      veget:row[ix.veget]||'', playlist:row[ix.playlist]||'',
      ures:!muv
    });
  }
  return res;
}

function isVarom(v) {
  if(!v||v.trim()==='') return false;
  var l=v.toLowerCase();
  return l==='tba'||l.indexOf('varom')>=0||l.indexOf('várom')>=0||l.indexOf('igerte')>=0||l.indexOf('ígérte')>=0||l.indexOf('varjuk')>=0||l.indexOf('várjuk')>=0;
}

function cellStatus(v) {
  if(!v||v.trim()==='') return '<span class="ur" title="Nincs info">—</span>';
  if(isVarom(v)) return '<span class="vr" title="'+v+'">⏳</span>';
  return '<span class="ok" title="'+v+'">✅</span>';
}

function buildUzenet(r) {
  var hianyzok=[];
  STATUS_COLS.forEach(function(c){
    if(isVarom(r[c.k])) hianyzok.push('– '+c.l);
  });
  if(hianyzok.length===0) return null;
  var nev=r.felelos?r.felelos.split('\n')[0].trim():'';
  var szoveg='Kedves '+(nev||r.muv)+'!\n\n';
  szoveg+='Kérem küldje el az alábbiakat a Kolozsvári Magyar Napok szervezéshez ('+r.dat+', '+r.hely+'):\n\n';
  szoveg+=hianyzok.join('\n');
  szoveg+='\n\nKöszönöm!\nGergely Bálint Ákos\nSzervező\nKolozsvári Magyar Napok';
  return szoveg;
}

function load() {
  document.getElementById('info').textContent='Betöltés...';
  fetch('https://docs.google.com/spreadsheets/d/'+SID+'/export?format=csv&gid=0&_='+Date.now())
    .then(function(r){return r.arrayBuffer();})
    .then(function(b){
      var t=new TextDecoder('utf-8').decode(b);
      ROWS=mapRows(parseCSV(t));
      document.getElementById('info').textContent='Frissítve: '+new Date().toLocaleTimeString('hu-HU')+' ('+ROWS.length+' sor)';
      buildSelects();
      render();
    })
    .catch(function(e){document.getElementById('info').textContent='Hiba: '+e.message;});
}

function buildSelects() {
  var sh=document.getElementById('fhely'), sd=document.getElementById('fdat');
  sh.innerHTML='<option value="">Minden helyszín</option>';
  sd.innerHTML='<option value="">Minden dátum</option>';
  var helyek={}, datumok={};
  ROWS.forEach(function(r){if(r.hely)helyek[r.hely]=1;if(r.dat)datumok[r.dat]=1;});
  Object.keys(helyek).sort().forEach(function(v){sh.innerHTML+='<option>'+v+'</option>';});
  Object.keys(datumok).sort().forEach(function(v){sd.innerHTML+='<option>'+v+'</option>';});
}

function hbadge(h) {
  if(!h) return '';
  var l=h.toLowerCase();
  var cls=l.indexOf('főtér')>=0?'bf':l.indexOf('bánffy')>=0?'bb':l.indexOf('farkas')>=0?'bfk':l.indexOf('redut')>=0?'br':'';
  return cls?'<span class="badge '+cls+'">'+h+'</span>':h;
}

function sbadge(h,u) {
  if(u&&!h) return '<span class="badge" style="background:#eee;color:#999">üres</span>';
  if(!h) return '';
  var l=h.toLowerCase();
  if(l.trim()==='ok') return '<span class="badge bok">OK</span>';
  if(l.indexOf('várom')>=0||l.indexOf('ígérte')>=0) return '<span class="badge bvr">Várok</span>';
  if(l.indexOf('küldeni')>=0||l.indexOf('tisztázni')>=0||h.indexOf('!')>=0) return '<span class="badge btd">Teendő</span>';
  return '<span class="badge bvr">Folyamatban</span>';
}

function fmt(v){return v?Number(v).toLocaleString('hu-HU'):'—';}

var COLS={
  all:[{k:'dat',l:'Dátum'},{k:'nap',l:'Nap'},{k:'t1',l:'Kezdés'},{k:'muv',l:'Művész'},{k:'hely',l:'Helyszín'},{k:'felelos',l:'Felelős'},{k:'tel',l:'Telefon'},{k:'helyzet',l:'Státusz'}],
  todo:[{k:'dat',l:'Dátum'},{k:'muv',l:'Művész'},{k:'hely',l:'Helyszín'},{k:'felelos',l:'Felelős'},{k:'helyzet',l:'Teendő'}],
  money:[{k:'dat',l:'Dátum'},{k:'muv',l:'Művész'},{k:'hely',l:'Helyszín'},{k:'osszeg',l:'Összeg'},{k:'huf',l:'HUF'},{k:'ron',l:'RON'},{k:'szolg',l:'Szolgáltató'}],
  cater:[{k:'dat',l:'Dátum'},{k:'muv',l:'Művész'},{k:'hely',l:'Helyszín'},{k:'bistro',l:'Bistro'},{k:'ceb',l:'Culina ebéd'},{k:'cv21',l:'Vacsora 20:30'},{k:'cv22',l:'Vacsora 22:30'},{k:'cfu',l:'Farkas u.'}]
};

function getFiltered() {
  var q=(document.getElementById('q').value||'').toLowerCase();
  var fh=document.getElementById('fhely').value;
  var fd=document.getElementById('fdat').value;
  return ROWS.filter(function(r){
    if(r.ures) return false;
    if(TAB==='todo'&&!r.helyzet) return false;
    if(TAB==='money'&&!r.osszeg) return false;
    if(q&&Object.values(r).join(' ').toLowerCase().indexOf(q)<0) return false;
    if(fh&&r.hely!==fh) return false;
    if(fd&&r.dat!==fd) return false;
    return true;
  });
}

function render() {
  var rows=getFiltered();
  if(SK) rows.sort(function(a,b){
    var x=a[SK]||'',y=b[SK]||'';
    return typeof x==='number'?(x-y)*SD:String(x).localeCompare(String(y),'hu')*SD;
  });
  var t=ROWS.length,k=ROWS.filter(function(r){return!r.ures;}).length;
  var u=ROWS.filter(function(r){return r.ures;}).length;
  var td=ROWS.filter(function(r){return r.helyzet&&r.helyzet.trim().toLowerCase()!=='ok';}).length;
  var sm=ROWS.reduce(function(a,r){return a+(r.huf||0);},0);
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="n">'+t+'</div><div class="l">Összes szlot</div></div>'+
    '<div class="stat"><div class="n" style="color:green">'+k+'</div><div class="l">Kitöltve</div></div>'+
    '<div class="stat"><div class="n" style="color:red">'+u+'</div><div class="l">Üres</div></div>'+
    '<div class="stat"><div class="n" style="color:orange">'+td+'</div><div class="l">Teendő</div></div>'+
    '<div class="stat"><div class="n" style="font-size:14px">'+sm.toLocaleString('hu-HU')+'</div><div class="l">Összeg HUF</div></div>';
  document.getElementById('legend').style.display=TAB==='status'?'flex':'none';
  document.getElementById('maintable').className=TAB==='status'?'status-table':'';
  if(TAB==='status') renderStatus(rows);
  else renderNormal(rows);
  document.getElementById('count').textContent=rows.length+' sor';
}

function renderNormal(rows) {
  var cols=COLS[TAB];
  document.getElementById('thead').innerHTML='<tr>'+cols.map(function(c){return'<th onclick="sort(\''+c.k+'\')">'+c.l+'</th>';}).join('')+'</tr>';
  if(!rows.length){document.getElementById('tbody').innerHTML='<tr><td colspan="'+cols.length+'"><div class="empty">Nincs találat.</div></td></tr>';return;}
  document.getElementById('tbody').innerHTML=rows.map(function(r){
    var ri=ROWS.indexOf(r);
    return '<tr onclick="openModal('+ri+')">'
      +cols.map(function(c){
        var v=r[c.k]||'';
        if(c.k==='hely') v=hbadge(v);
        else if(c.k==='helyzet') v=sbadge(v,r.ures)+(v?' <span style="font-size:12px;color:#888">'+v.slice(0,50)+(v.length>50?'…':'')+'</span>':'');
        else if(c.k==='huf'||c.k==='ron') v=fmt(v);
        else if(['bistro','ceb','cv21','cv22','cfu'].indexOf(c.k)>=0&&v) v='✓';
        return '<td title="'+(r[c.k]||'')+'">'+v+'</td>';
      }).join('')+'</tr>';
  }).join('');
}

function renderStatus(rows) {
  var hdr='<tr><th>Művész</th><th>Helyszín</th>';
  STATUS_COLS.forEach(function(c){hdr+='<th>'+c.l+'</th>';});
  hdr+='</tr>';
  document.getElementById('thead').innerHTML=hdr;
  if(!rows.length){document.getElementById('tbody').innerHTML='<tr><td colspan="'+(STATUS_COLS.length+2)+'"><div class="empty">Nincs találat.</div></td></tr>';return;}
  document.getElementById('tbody').innerHTML=rows.map(function(r){
    var ri=ROWS.indexOf(r);
    var cells='<td onclick="openModal('+ri+')" style="cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis" title="'+r.muv+'">'+r.muv+'</td>';
    cells+='<td>'+hbadge(r.hely)+'</td>';
    STATUS_COLS.forEach(function(c){cells+='<td onclick="openModal('+ri+')" style="cursor:pointer">'+cellStatus(r[c.k])+'</td>';});
    return '<tr>'+cells+'</tr>';
  }).join('');
}

function sort(k){if(SK===k)SD*=-1;else{SK=k;SD=1;}render();}

function setTab(t,btn){
  TAB=t;SK=null;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  render();
}

function openModal(i) {
  var r=ROWS[i];
  document.getElementById('mtitle').innerHTML=r.muv+' '+hbadge(r.hely);
  document.getElementById('msub').textContent=r.dat+(r.nap?' · '+r.nap:'')+(r.t1?' · '+r.t1:'');
  var h='';
  if(r.helyzet) h+='<div class="todo">'+r.helyzet+'</div>';

  // Emlékeztető üzenet generálás
  var uzenet=buildUzenet(r);
  if(uzenet) {
    h+='<div class="uzenet-box">';
    h+='<h4>📨 Emlékeztető üzenet — másolható</h4>';
    h+='<div class="uzenet-text" id="uzenet-text-'+i+'">'+uzenet+'</div>';
    h+='<button class="copy-btn" onclick="copyUzenet('+i+',\''+uzenet.replace(/'/g,"\\'").replace(/\n/g,'\\n')+'\')" id="copy-btn-'+i+'">📋 Másolás vágólapra</button>';
    h+='</div>';
    h+='<hr class="divider">';
  }

  h+='<div class="mgrid">';
  h+='<div><div class="ml">Felelős</div><div class="mv">'+r.felelos+'</div></div>';
  h+='<div><div class="ml">Telefon</div><div class="mv">'+r.tel+'</div></div>';
  h+='<div><div class="ml">E-mail</div><div class="mv">'+r.email+'</div></div>';
  h+='<div><div class="ml">Funkció</div><div class="mv">'+r.funkcio+'</div></div>';
  if(r.osszeg||r.huf||r.ron){
    h+='<div><div class="ml">Összeg</div><div class="mv">'+r.osszeg+'</div></div>';
    h+='<div><div class="ml">HUF / RON</div><div class="mv">'+(r.huf?fmt(r.huf)+' HUF':'—')+(r.ron?' / '+fmt(r.ron)+' RON':'')+'</div></div>';
  }
  if(r.rider) h+='<div class="mf"><div class="ml">Rider</div><div class="mv">'+r.rider+'</div></div>';
  h+='</div>';
  document.getElementById('mbody').innerHTML=h;
  document.getElementById('modal').classList.add('open');
}

function copyUzenet(i, szoveg) {
  var text=szoveg.replace(/\\n/g,'\n');
  navigator.clipboard.writeText(text).then(function(){
    var btn=document.getElementById('copy-btn-'+i);
    btn.textContent='✅ Másolva!';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent='📋 Másolás vágólapra';
      btn.classList.remove('copied');
    },2000);
  });
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

load();
setInterval(load,60000);
</script>
