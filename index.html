<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMN26 — Koncertadatbázis</title>
<style>
:root{--bg:#FAFAF7;--bg-card:#FFF;--bg-soft:#F1EFE8;--border:#E5E3DC;--text:#1F1E1B;--text-soft:#6B6A65;--text-muted:#94928C;--info-bg:#E6F1FB;--info-text:#0C447C;--warn-bg:#FAEEDA;--warn-text:#854F0B;--error-bg:#FAECE7;--error-text:#993C1D;--success-bg:#EAF3DE;--success-text:#3B6D11}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh;padding:1.25rem}
.container{max-width:1400px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:.25rem}
.subtitle{font-size:13px;color:var(--text-soft);margin-bottom:1.25rem}
.status-bar{display:flex;align-items:center;gap:10px;padding:.6rem .9rem;background:var(--bg-soft);border-radius:8px;margin-bottom:1rem;font-size:12px;color:var(--text-soft);flex-wrap:wrap}
.dot-live{width:8px;height:8px;border-radius:50%;background:#3B6D11;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.status-bar strong{color:var(--text)}
.refresh-btn{margin-left:auto;padding:5px 12px;border:.5px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-soft);font-size:12px;cursor:pointer}
.error-box{padding:2rem;background:var(--error-bg);color:var(--error-text);border-radius:8px;text-align:center;font-size:13px}
.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
.search-wrap{flex:1;min-width:180px}
input,select{padding:7px 10px;border:.5px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;width:100%}
select{cursor:pointer;width:auto}
.tabs{display:flex;gap:3px;background:var(--bg-soft);border-radius:8px;padding:3px;margin-bottom:1rem;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--text-soft);font-size:13px;flex:1;min-width:120px}
.tab.on{background:var(--bg-card);color:var(--text);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:1rem}
.stat{background:var(--bg-card);border:.5px solid var(--border);border-radius:8px;padding:.65rem .9rem}
.stat .lbl{font-size:11px;color:var(--text-soft);margin-bottom:3px}
.stat .val{font-size:18px;font-weight:500}
.tw{overflow-x:auto;border:.5px solid var(--border);border-radius:8px;background:var(--bg-card)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--bg-soft)}
th{padding:9px 12px;text-align:left;font-weight:500;font-size:12px;color:var(--text-soft);cursor:pointer;white-space:nowrap}
td{padding:9px 12px;border-bottom:.5px solid var(--bg-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
tr:hover td{background:var(--bg-soft);cursor:pointer}
tr.empty-row td{color:var(--text-muted);font-style:italic}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-foter{background:#E6F1FB;color:#0C447C}.b-banffy{background:#EEEDFE;color:#3C3489}.b-farkas{background:#E1F5EE;color:#085041}.b-redut{background:#FAEEDA;color:#633806}
.s-ok{background:var(--success-bg);color:var(--success-text)}.s-pending{background:var(--warn-bg);color:var(--warn-text)}.s-todo{background:var(--error-bg);color:var(--error-text)}.s-tba{background:var(--bg-soft);color:var(--text-soft)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-start;justify-content:center;padding:30px 15px}
.modal-bg.open{display:flex}
.modal{background:var(--bg-card);border-radius:8px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:1.25rem}
.mhdr{display:flex;justify-content:space-between;margin-bottom:1rem;gap:10px}
.mhdr h3{font-size:16px;font-weight:500}
.mcl{background:none;border:none;cursor:pointer;color:var(--text-soft);font-size:24px;line-height:1}
.msec{margin-bottom:1rem}
.msec h4{font-size:11px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ml{font-size:11px;color:var(--text-soft);margin-bottom:2px}
.mv{font-size:13px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.full{grid-column:1/-1}
.todo-box{background:var(--warn-bg);border-radius:6px;padding:.65rem .85rem;color:var(--warn-text);white-space:pre-wrap}
.empty{padding:2.5rem;text-align:center;color:var(--text-muted)}
.money{font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:600px){body{padding:.75rem}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<h1>KMN26 — Koncertadatbázis</h1>
<p class="subtitle">Élő nézet a Google Sheets-ből</p>
<div class="status-bar">
<span class="dot-live"></span>
<span>Adatforrás: <strong>KMN26_GBA</strong> · Frissítve: <strong id="lastUpdate">betöltés...</strong></span>
<button class="refresh-btn" onclick="loadData()">↻ Frissítés</button>
</div>
<div id="content"><div class="empty">Adatok betöltése...</div></div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)cm()">
<div class="modal">
<div class="mhdr"><div><h3 id="mt"></h3><div id="ms" style="font-size:12px;color:var(--text-soft);margin-top:3px"></div></div><button class="mcl" onclick="cm()">×</button></div>
<div id="mb"></div>
</div>
</div>
<script>
const SHEET_ID='1TU1LasWxZE2wuFUsAXq9hEzyAIym3BDIUnVTmwG18OQ';
const TABS={all:['dat','nap','t1','muvesz','hely','felelos','tel','helyzet'],todo:['dat','muvesz','hely','felelos','helyzet'],money:['dat','muvesz','hely','osszeg','huf','ron','szolgaltato'],cater:['dat','muvesz','hely','bistro','culina_eb','culina_v21','culina_v22','culina_fu']};
const LBL={dat:'Dátum',nap:'Nap',t1:'Kezdés',muvesz:'Művész',hely:'Helyszín',felelos:'Felelős',tel:'Telefon',helyzet:'Státusz/Teendő',osszeg:'Összeg',huf:'HUF',ron:'RON',szolgaltato:'Szolgáltató',bistro:'Bistro',culina_eb:'Culina ebéd',culina_v21:'Vacsora 20:30',culina_v22:'Vacsora 22:30',culina_fu:'Farkas u.'};
let ROWS=[],curTab='all',sortK=null,sortD=1,filt=[];
function noAccent(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[őű]/g,c=>c==='ő'?'o':'u')}
function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){row.push(cur);cur=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}if(cur||row.length){row.push(cur);rows.push(row)}return rows}
function parseMoney(s){if(!s)return null;const m=String(s).replace(/[.\s]/g,'').match(/(\d+)/);return m?parseInt(m[1],10):null}
function mapRows(g){const hi=g.findIndex(r=>r.some(c=>noAccent(c).includes('muvesz')||noAccent(c).includes('egyuttes')));if(hi===-1)return[];const h=g[hi],ix={};h.forEach((x,i)=>{const l=noAccent(x).replace(/\s+/g,' ').trim();if(l.includes('muvesz')||l.includes('egyuttes'))ix.muvesz=i;else if(l==='helyszin')ix.hely=i;else if(l==='datum')ix.dat=i;else if(l==='nap')ix.nap=i;else if(l.includes('kezdesi'))ix.t1=i;else if(l.includes('jelenlegi helyzet'))ix.helyzet=i;else if(l==='elerhetoseg')ix.felelos=i;else if(l==='funkcio')ix.funkcio=i;else if(l.includes('telefon'))ix.tel=i;else if(l.includes('mail'))ix.email=i;else if(l==='osszeg')ix.osszeg=i;else if(l==='huf')ix.huf=i;else if(l==='ron')ix.ron=i;else if(l==='szolgaltato')ix.szolgaltato=i;else if(l.includes('bistro'))ix.bistro=i;else if(l.includes('culina ebed'))ix.culina_eb=i;else if(l.includes('culina vacsora')&&l.includes('20.30'))ix.culina_v21=i;else if(l.includes('culina vacsora')&&l.includes('22.30'))ix.culina_v22=i;else if(l.includes('culina vacsora')&&l.includes('farkas'))ix.culina_fu=i;else if(l.includes('rider'))ix.rider=i;else if(l.includes('backstage'))ix.backstage=i});const r=[];for(let i=hi+1;i<g.length;i++){const x=g[i],muv=x[ix.muvesz]||'',hely=x[ix.hely]||'',dat=x[ix.dat]||'';if(!muv&&!hely&&!dat)continue;r.push({muvesz:muv||'(üres szlot)',hely,dat,nap:x[ix.nap]||'',t1:x[ix.t1]||'',helyzet:x[ix.helyzet]||'',felelos:x[ix.felelos]||'',funkcio:x[ix.funkcio]||'',tel:x[ix.tel]||'',email:x[ix.email]||'',osszeg:x[ix.osszeg]||'',huf:parseMoney(x[ix.huf]),ron:parseMoney(x[ix.ron]),szolgaltato:x[ix.szolgaltato]||'',bistro:x[ix.bistro]||'',culina_eb:x[ix.culina_eb]||'',culina_v21:x[ix.culina_v21]||'',culina_v22:x[ix.culina_v22]||'',culina_fu:x[ix.culina_fu]||'',rider:x[ix.rider]||'',backstage:x[ix.backstage]||'',ures:!muv})}return r}
async function loadData(){try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1&_=${Date.now()}`);if(!r.ok)throw new Error('Sheets nem érhető el (HTTP '+r.status+')');const b=await r.arrayBuffer();const t=new TextDecoder('utf-8').decode(b);const g=parseCSV(t);ROWS=mapRows(g);if(ROWS.length===0)throw new Error('Nem találtam adatokat. Ellenőrizd, hogy a Sheet1-ben van a fejléc.');document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('hu-HU')+' ('+ROWS.length+' sor)';renderApp()}catch(e){document.getElementById('content').innerHTML=`<div class="error-box"><strong>Hiba:</strong> ${e.message}<br><small>Ellenőrizd, hogy a Sheets "link birtokában bárki" módra van állítva.</small></div>`}}
function helyBadge(h){if(!h)return'';const l=h.toLowerCase();if(l.includes('főtér'))return`<span class="badge b-foter">${h}</span>`;if(l.includes('bánffy'))return`<span class="badge b-banffy">${h}</span>`;if(l.includes('farkas'))return`<span class="badge b-farkas">${h}</span>`;if(l.includes('redut'))return`<span class="badge b-redut">${h}</span>`;return`<span class="badge s-tba">${h}</span>`}
function statusBadge(h,u){if(u&&!h)return'<span class="badge s-tba">üres</span>';if(!h)return'';const l=h.toLowerCase();if(l.trim()==='ok')return'<span class="badge s-ok">OK</span>';if(l.includes('várom')||l.includes('ígérte')||l.includes('várok'))return'<span class="badge s-pending">Várok</span>';if(l.includes('küldeni')||l.includes('tisztázni')||l.includes('!'))return'<span class="badge s-todo">Teendő</span>';return'<span class="badge s-pending">Folyamatban</span>'}
function fmtMoney(v){return v?Number(v).toLocaleString('hu-HU'):'—'}
function renderApp(){document.getElementById('content').innerHTML=`<div class="tabs"><button class="tab ${curTab==='all'?'on':''}" onclick="setTab('all')">📋 Összes</button><button class="tab ${curTab==='todo'?'on':''}" onclick="setTab('todo')">✅ Teendők</button><button class="tab ${curTab==='money'?'on':''}" onclick="setTab('money')">💰 Pénzügy</button><button class="tab ${curTab==='cater'?'on':''}" onclick="setTab('cater')">🍽️ Catering</button></div><div class="topbar"><div class="search-wrap"><input type="text" id="q" placeholder="Keresés..."></div><select id="sfHely"><option value="">Minden helyszín</option></select><select id="sfDat"><option value="">Minden dátum</option></select></div><div class="stats" id="stats"></div><div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div><div style="padding:.6rem 0;font-size:12px;color:var(--text-soft)" id="fi"></div>`;[...new Set(ROWS.map(r=>r.hely).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.text=v;document.getElementById('sfHely').appendChild(o)});[...new Set(ROWS.map(r=>r.dat).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.text=v;document.getElementById('sfDat').appendChild(o)});document.getElementById('q').addEventListener('input',af);document.getElementById('sfHely').addEventListener('change',af);document.getElementById('sfDat').addEventListener('change',af);af()}
function af(){const q=document.getElementById('q').value.toLowerCase(),h=document.getElementById('sfHely').value,d=document.getElementById('sfDat').value;filt=ROWS.filter(r=>{if(curTab==='todo'&&!r.helyzet&&!r.ures)return false;if(curTab==='money'&&!r.osszeg)return false;if(q&&!Object.values(r).join(' ').toLowerCase().includes(q))return false;if(h&&r.hely!==h)return false;if(d&&r.dat!==d)return false;return true});if(sortK)filt.sort((a,b)=>{const x=a[sortK]??'',y=b[sortK]??'';return typeof x==='number'?(x-y)*sortD:String(x).localeCompare(String(y),'hu')*sortD});renderStats();renderTable();document.getElementById('fi').textContent=`${filt.length} sor`}
function renderStats(){const t=ROWS.length,k=ROWS.filter(r=>!r.ures).length,u=ROWS.filter(r=>r.ures).length,td=ROWS.filter(r=>r.helyzet&&r.helyzet.trim().toLowerCase()!=='ok').length,s=ROWS.reduce((a,r)=>a+(r.hu
